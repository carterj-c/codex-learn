model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[agents.curriculum-designer]
description = "Design or substantially revise a subject curriculum without teaching the learner."
config_file = "agents/curriculum-designer.toml"

[agents.lesson-researcher]
description = "Verify lesson claims against relevant curriculum sources before teaching relies on them."
config_file = "agents/lesson-researcher.toml"

[agents.source-indexer]
description = "Create compact structural retrieval maps for curriculum sources."
config_file = "agents/source-indexer.toml"
